site_name: Lmy271828
site_url: https://lmy271828.github.io/
site_description: FPGA / PYNQ / 机器视觉 学习笔记与实验记录
repo_url: https://github.com/Lmy271828/Lmy271828.github.io
copyright: Copyright &copy; 2026 Lmy271828

theme:
  name: material
  language: zh
  features:
    - navigation.top
    - navigation.footer
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - 首页: index.md
